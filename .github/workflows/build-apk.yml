name: Build Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubicloud-standard-8

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # NOTE: no quotes — the action splits on spaces and passes each token
          # literally, so quoted entries fail as '"platforms;android-35"'.
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Resolve version
        id: version
        run: |
          BASE_VERSION=$(node -p "require('./apps/mobile/app.json').expo.version")
          BASE_CODE=$(node -p "require('./apps/mobile/app.json').expo.android.versionCode || 0")
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF#refs/tags/v}"
          else
            VERSION_NAME="${BASE_VERSION}-build.${{ github.run_number }}"
          fi
          # run_number is monotonic, + BASE_CODE offset avoids downgrade vs current store version
          VERSION_CODE=$((BASE_CODE + ${{ github.run_number }}))
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "Resolved ${VERSION_NAME} (${VERSION_CODE}) from base ${BASE_VERSION} (${BASE_CODE})"

      - name: Bump app version
        working-directory: apps/mobile
        run: |
          node -e "
          const fs = require('fs');
          const path = './app.json';
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          data.expo.version = process.env.VERSION_NAME;
          data.expo.android = data.expo.android || {};
          data.expo.android.versionCode = Number(process.env.VERSION_CODE);
          fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');
          console.log('Bumped to', data.expo.version, data.expo.android.versionCode);
          "
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prebuild Android native project
        working-directory: apps/mobile
        run: bunx expo prebuild --platform android --clean

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/mobile/android/gradle/wrapper/gradle-wrapper.properties', 'apps/mobile/android/app/build.gradle', 'apps/mobile/android/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        working-directory: apps/mobile
        run: chmod +x android/gradlew

      - name: Build Release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Generate version.json for in-app updater
        working-directory: apps/mobile
        run: |
          node -e "
          const fs = require('fs');
          const out = {
            versionCode: Number(process.env.VERSION_CODE),
            versionName: process.env.VERSION_NAME,
            apkUrl: '${{ github.server_url }}/${{ github.repository }}/releases/latest/download/app-release.apk'
          };
          fs.writeFileSync('version.json', JSON.stringify(out, null, 2));
          console.log(JSON.stringify(out));
          "
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk

      - name: Publish APK to GitHub Release (tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            apps/mobile/version.json

      - name: Publish APK to rolling latest release (main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: |
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            apps/mobile/version.json
